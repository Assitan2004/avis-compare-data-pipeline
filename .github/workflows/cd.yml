name: CD — AvisCompare (C19)

# Livraison continue : à chaque push sur main, une fois les tests
# passés (workflow ci.yml), cette chaîne construit une image Docker
# de l'API et la publie sur le GitHub Container Registry (ghcr.io).
# Cela ne nécessite aucun compte externe : ghcr.io est directement
# lié au compte GitHub qui héberge le dépôt.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & push image Docker (C19)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}